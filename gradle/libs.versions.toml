[versions]
# Build
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"

# Code quality
spotless = "8.10.4"
ktlint = "1.8.0"
detekt = "1.23.8"
# Code coverage for the JVM and Android unit tests, merged into one report.
kover = "0.9.11"
# SBOM of the shipped dependencies, scanned by OSV-Scanner (scripts/scan-dependencies.sh).
cyclonedx = "3.5.0"

# AndroidX
benchmarkMacro = "1.5.0"
uiautomator = "2.4.0"
composeBom = "2026.09.00"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigationCompose = "2.10.2"
room = "2.8.5"
work = "2.12.0"
camerax = "1.6.2"
datastore = "1.2.1"
exifinterface = "1.4.2"

# DI
hilt = "2.60.1"
# androidx.hilt: Compose navigation and WorkManager integration share one version.
androidxHilt = "1.4.0"

# Kotlin libraries
coroutines = "1.11.0"
serialization = "1.11.0"

# Network and images
retrofit = "3.0.0"
okhttp = "5.5.0"
coil = "3.6.3"

# Google
mlkitBarcode = "17.3.0"
playServicesAuth = "22.0.0"

# Backup encryption: Tink for streaming AES-256-GCM, Bouncy Castle only for Argon2id.
tink = "1.23.0"
bouncycastle = "1.86"

# Test
junit = "4.13.2"
turbine = "1.2.1"
androidxTestExt = "1.3.0"
androidxTestRunner = "1.7.0"
androidxTestCore = "1.7.0"
robolectric = "4.17"
konsist = "0.17.3"

# Build classpath only: patched versions of libraries that Gradle plugins bring in with known
# vulnerabilities (AGP, Kover, CycloneDX). Applied as constraints in the root build.gradle.kts;
# Bouncy Castle reuses the version above. Drop an entry once its plugin ships the fix.
buildJackson = "2.22.3"
buildFreemarker = "2.3.35"
buildJose4j = "0.9.7"
buildJdom2 = "2.0.6.1"
# Android Lint's own runtime (androidLintTool), and androidx.benchmark's Wire in :benchmark.
buildCommonsLang3 = "3.21.0"
buildHttpclient = "4.5.14"
benchmarkWire = "7.0.1"

[libraries]
# AndroidX core
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-navigation-testing = { module = "androidx.navigation:navigation-testing", version.ref = "navigationCompose" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }

# Compose (versions come from the BOM)
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }

# Room
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

# WorkManager
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "work" }

# CameraX
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }

# Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "androidxHilt" }
androidx-hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "androidxHilt" }
androidx-hilt-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "androidxHilt" }

# Benchmarks
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmarkMacro" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }

# Kotlin libraries
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# Network and images
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

# Google
mlkit-barcode-scanning = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkitBarcode" }
play-services-auth = { module = "com.google.android.gms:play-services-auth", version.ref = "playServicesAuth" }
tink-android = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }

# Test
junit = { module = "junit:junit", version.ref = "junit" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-core-ktx = { module = "androidx.test:core-ktx", version.ref = "androidxTestCore" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }

# Build classpath constraints (see buildJackson above)
build-jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "buildJackson" }
build-freemarker = { module = "org.freemarker:freemarker", version.ref = "buildFreemarker" }
build-jose4j = { module = "org.bitbucket.b_c:jose4j", version.ref = "buildJose4j" }
build-jdom2 = { module = "org.jdom:jdom2", version.ref = "buildJdom2" }
build-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
build-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
build-commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "buildCommonsLang3" }
build-httpclient = { module = "org.apache.httpcomponents:httpclient", version.ref = "buildHttpclient" }
benchmark-wire-runtime = { module = "com.squareup.wire:wire-runtime", version.ref = "benchmarkWire" }

[plugins]
android-test = { id = "com.android.test", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room = { id = "androidx.room", version.ref = "room" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
