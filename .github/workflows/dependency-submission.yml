name: Dependency Graph

# Submits the resolved Gradle dependency tree, transitive dependencies and plugins included, to
# GitHub's dependency graph. GitHub cannot read version catalogs or transitive dependencies from
# the build files alone, so without this Dependabot alerts and security updates see no Gradle
# library at all. Alerts follow the default branch; develop is submitted too, where work happens.
#
# Runs only when a push changes what Gradle resolves: the version catalog, a build script, the
# settings, Gradle properties or the wrapper. GitHub keeps the last submitted tree, so other
# pushes need no new submission. Run it by hand (workflow_dispatch) if the graph looks stale.
on:
  push:
    branches: [main, develop]
    paths:
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/dependency-submission.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit:
    name: Submit Gradle dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write # the dependency submission API needs it; nothing else in this job writes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
