name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Least privilege: the job only reads the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit SHA, because a tag can be moved. Dependabot keeps the SHAs
      # and the version comments current (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Needs Node.js, which the runner image provides. Rules: docs/MARKDOWN_GUIDE.md.
      - name: Markdown lint
        run: scripts/lint-markdown.sh

      # assembleRelease runs R8 over the real release build, so a missing keep rule or a class R8
      # cannot resolve fails here, not on a user's device. With no keystore.properties in CI it is
      # signed with the debug key.
      - name: Style, static analysis, docs, lint, unit tests, assemble
        run: ./gradlew spotlessCheck detekt checkDocs lint testDebugUnitTest :domain:test assembleDebug assembleRelease

      # Warns (does not fail) when build, setup or tooling files changed without a docs update.
      - name: Documentation impact
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scripts/docs-impact.sh "origin/${{ github.base_ref }}" HEAD
          else
            scripts/docs-impact.sh "${{ github.event.before }}" HEAD
          fi
