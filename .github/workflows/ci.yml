name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Style, static analysis, lint, unit tests, assemble
        run: ./gradlew spotlessCheck detekt lint testDebugUnitTest :domain:test assembleDebug
