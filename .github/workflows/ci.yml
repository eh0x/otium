name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Least privilege: the job only reads the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit SHA, because a tag can be moved. Dependabot keeps the SHAs
      # and the version comments current (.github/dependabot.yml).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # Needs Node.js, which the runner image provides. Rules: docs/MARKDOWN_GUIDE.md.
      - name: Markdown lint
        run: scripts/lint-markdown.sh

      - name: Style, static analysis, docs, lint, unit tests, assemble
        run: ./gradlew spotlessCheck detekt checkDocs lint testDebugUnitTest :domain:test assembleDebug

      # Warns (does not fail) when build, setup or tooling files changed without a docs update.
      - name: Documentation impact
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scripts/docs-impact.sh "origin/${{ github.base_ref }}" HEAD
          else
            scripts/docs-impact.sh "${{ github.event.before }}" HEAD
          fi
