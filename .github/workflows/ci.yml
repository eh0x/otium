name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Needs Node.js, which the runner image provides. Rules: docs/MARKDOWN_GUIDE.md.
      - name: Markdown lint
        run: scripts/lint-markdown.sh

      - name: Style, static analysis, docs, lint, unit tests, assemble
        run: ./gradlew spotlessCheck detekt checkDocs lint testDebugUnitTest :domain:test assembleDebug

      # Warns (does not fail) when build, setup or tooling files changed without a docs update.
      - name: Documentation impact
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scripts/docs-impact.sh "origin/${{ github.base_ref }}" HEAD
          else
            scripts/docs-impact.sh "${{ github.event.before }}" HEAD
          fi
