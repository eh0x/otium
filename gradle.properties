org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official
android.useAndroidX=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# The app version, in one place. SemVer with an optional uppercase stage, as in 1.2.0, 1.2.0-BETA1
# or 1.2.0-RC2; the release tag is this value with a "v" in front. app/build.gradle.kts derives
# versionCode from it. See docs/RELEASING.md.
otium.versionName=1.0.0
